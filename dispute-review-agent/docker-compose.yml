# Open-source services for the knowledge base. Start PostgreSQL with:
#   docker compose up -d
# Run Ollama natively (it uses the GPU on macOS) and pull the models:
#   ollama pull bge-m3 && ollama pull qwen2.5:7b
# then run the backend as usual (npm run dev); its .env defaults point here.
#
# No native Ollama (e.g. Linux without a GPU)? Start the container instead:
#   docker compose --profile ollama up -d
#   docker compose exec ollama ollama pull bge-m3
#   docker compose exec ollama ollama pull qwen2.5:7b

services:
  postgres:
    # PostgreSQL 17 + pgvector 0.8 (PostgreSQL License)
    image: pgvector/pgvector:pg17
    # Come back up whenever Docker starts, until stopped with docker compose stop/down
    restart: unless-stopped
    environment:
      POSTGRES_USER: dispute
      POSTGRES_PASSWORD: dispute
      POSTGRES_DB: dispute_review
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dispute -d dispute_review']
      interval: 5s
      retries: 10

  ollama:
    # Local model server (MIT). Opt-in: the native Ollama app is much faster on
    # macOS because it uses the GPU, so this only starts with --profile ollama.
    image: ollama/ollama:latest
    profiles: ['ollama']
    ports:
      - '11434:11434'
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
